<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Adventure Quest</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    h1 {
      color: #4a3db8;
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 22px;
      line-height: 1.5;
    }

    .question-box {
      background: #eef3ff;
      border-radius: 18px;
      padding: 25px;
      margin: 25px 0;
      min-height: 120px;
    }

    .question {
      font-size: 32px;
      font-weight: bold;
      color: #253b80;
      margin-bottom: 20px;
    }

    .answers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .answer-btn, .start-btn, .next-btn, .home-btn {
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 24px;
      cursor: pointer;
    }

    .answer-btn {
      background: #ffd76a;
      min-width: 110px;
    }

    .answer-btn:hover {
      transform: scale(1.05);
    }

    .start-btn, .next-btn, .home-btn {
      background: #4a3db8;
      color: white;
      margin-top: 15px;
    }

    .feedback {
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
      min-height: 40px;
    }

    .score {
      font-size: 24px;
      margin-bottom: 15px;
      color: #555;
    }

    .star {
      font-size: 34px;
    }

    .hidden {
      display: none;
    }

    .level-title {
      font-size: 26px;
      color: #7a4fd1;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Number Adventure Quest</h1>
    <p>Use your number brain to solve fun puzzles and reach the treasure!</p>

    <div id="startScreen">
      <p>In this game, you will solve number puzzles, patterns, and logic questions.</p>
      <button class="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <div id="gameScreen" class="hidden">
      <div class="score">Score: <span id="score">0</span> / <span id="total">0</span></div>
      <div class="level-title" id="levelTitle"></div>

      <div class="question-box">
        <div class="question" id="questionText"></div>
        <div class="answers" id="answersBox"></div>
      </div>

      <div class="feedback" id="feedback"></div>
      <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">Next Puzzle</button>
    </div>

    <div id="endScreen" class="hidden">
      <h2>Great Job, Number Explorer!</h2>
      <p>You finished the adventure.</p>
      <p class="star">⭐ ⭐ ⭐</p>
      <p>Your final score: <span id="finalScore"></span></p>
      <button class="start-btn" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        level: "Level 1: Number Order",
        question: "What number comes next? 2, 3, 4, __",
        answers: ["5", "6", "7"],
        correct: "5",
        success: "Yes! 5 comes next."
      },
      {
        level: "Level 2: Bigger or Smaller",
        question: "Which number is bigger?",
        answers: ["8", "5"],
        correct: "8",
        success: "Correct! 8 is bigger than 5."
      },
      {
        level: "Level 3: Skip Counting",
        question: "What comes next? 2, 4, 6, __",
        answers: ["7", "8", "10"],
        correct: "8",
        success: "Awesome! That is skip counting by 2."
      },
      {
        level: "Level 4: Pattern Logic",
        question: "Find the pattern: 1, 3, 1, 3, 1, __",
        answers: ["2", "3", "4"],
        correct: "3",
        success: "Great thinking! The pattern repeats 1, 3."
      },
      {
        level: "Level 5: Number Path",
        question: "You are on 4. Move forward 2 spaces. Where do you land?",
        answers: ["5", "6", "7"],
        correct: "6",
        success: "Yes! 4 plus 2 is 6."
      },
      {
        level: "Level 6: Compare Numbers",
        question: "Which is smaller?",
        answers: ["9", "6"],
        correct: "6",
        success: "Correct! 6 is smaller."
      },
      {
        level: "Level 7: Missing Number",
        question: "Fill in the missing number: 10, 9, __, 7",
        answers: ["6", "8", "5"],
        correct: "8",
        success: "Excellent! The numbers are counting backward."
      },
      {
        level: "Level 8: Logic Choice",
        question: "To reach number 10 from 8, what should you add?",
        answers: ["1", "2", "3"],
        correct: "2",
        success: "Perfect! 8 plus 2 equals 10."
      },
      {
        level: "Level 9: Fast Number Brain",
        question: "Which number does NOT belong? 2, 4, 6, 7, 8",
        answers: ["6", "7", "8"],
        correct: "7",
        success: "Smart! 7 breaks the pattern of even numbers."
      },
      {
        level: "Level 10: Treasure Puzzle",
        question: "Choose the path of numbers in order:",
        answers: ["1, 2, 3, 4", "1, 3, 2, 4", "2, 1, 3, 4"],
        correct: "1, 2, 3, 4",
        success: "You found the treasure path!"
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function startGame() {
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      document.getElementById("total").textContent = questions.length;
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("levelTitle").textContent = q.level;
      document.getElementById("questionText").textContent = q.question;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextBtn").classList.add("hidden");

      const answersBox = document.getElementById("answersBox");
      answersBox.innerHTML = "";

      q.answers.forEach(answer => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.textContent = answer;
        btn.onclick = () => checkAnswer(answer);
        answersBox.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      const q = questions[currentQuestion];
      const feedback = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const buttons = document.querySelectorAll(".answer-btn");

      buttons.forEach(btn => btn.disabled = true);

      if (selected === q.correct) {
        score++;
        document.getElementById("score").textContent = score;
        feedback.textContent = "✅ " + q.success;
        feedback.style.color = "green";
      } else {
        feedback.textContent = "❌ Nice try! The correct answer is " + q.correct + ".";
        feedback.style.color = "crimson";
      }

      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.remove("hidden");
      document.getElementById("finalScore").textContent = score + " / " + questions.length;
    }

    function restartGame() {
      currentQuestion = 0;
      score = 0;
      document.getElementById("score").textContent = "0";
      document.getElementById("endScreen").classList.add("hidden");
      document.getElementById("startScreen").classList.remove("hidden");
    }
  </script>
</body>
</html>
