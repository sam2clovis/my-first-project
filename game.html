<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Adventure Quest</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    h1 {
      color: #4a3db8;
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 22px;
      line-height: 1.5;
    }

    .question-box {
      background: #eef3ff;
      border-radius: 18px;
      padding: 25px;
      margin: 25px 0;
      min-height: 120px;
    }

    .question {
      font-size: 32px;
      font-weight: bold;
      color: #253b80;
      margin-bottom: 20px;
    }

    .answers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .answer-btn, .start-btn, .next-btn {
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 24px;
      cursor: pointer;
    }

    .answer-btn {
      background: #ffd76a;
      min-width: 110px;
    }

    .answer-btn:hover {
      transform: scale(1.05);
    }

    .start-btn, .next-btn {
      background: #4a3db8;
      color: white;
      margin-top: 15px;
    }

    .feedback {
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
      min-height: 40px;
    }

    .score {
      font-size: 24px;
      margin-bottom: 15px;
      color: #555;
    }

    .star {
      font-size: 34px;
    }

    .hidden {
      display: none;
    }

    .level-title {
      font-size: 26px;
      color: #7a4fd1;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Number Adventure Quest</h1>
    <p>Let’s play with numbers, Yunus!</p>

    <div id="startScreen">
      <p>Answer the number questions and have fun.</p>
      <button class="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <div id="gameScreen" class="hidden">
      <div class="score">Score: <span id="score">0</span> / <span id="total">0</span></div>
      <div class="level-title" id="levelTitle"></div>

      <div class="question-box">
        <div class="question" id="questionText"></div>
        <div class="answers" id="answersBox"></div>
      </div>

      <div class="feedback" id="feedback"></div>
      <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

    <div id="endScreen" class="hidden">
      <h2>Great job, Yunus!</h2>
      <p>You finished the game.</p>
      <p class="star">⭐ ⭐ ⭐</p>
      <p>Your score: <span id="finalScore"></span></p>
      <button class="start-btn" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        level: "Level 1",
        question: "What comes next? 2, 3, 4, __",
        answers: ["5", "6", "7"],
        correct: "5",
        success: "Perfect, Yunus! 5 comes next."
      },
      {
        level: "Level 2",
        question: "Which number is bigger?",
        answers: ["8", "5"],
        correct: "8",
        success: "Great job, Yunus! 8 is bigger."
      },
      {
        level: "Level 3",
        question: "What comes next? 2, 4, 6, __",
        answers: ["7", "8", "10"],
        correct: "8",
        success: "Awesome, Yunus! 8 comes next."
      },
      {
        level: "Level 4",
        question: "Look at the pattern: 1, 3, 1, 3, 1, __",
        answers: ["2", "3", "4"],
        correct: "3",
        success: "Yes, Yunus! 3 comes next."
      },
      {
        level: "Level 5",
        question: "Start at 4. Move 2 more. Where are you now?",
        answers: ["5", "6", "7"],
        correct: "6",
        success: "Perfect, Yunus! You got 6."
      },
      {
        level: "Level 6",
        question: "Which number is smaller?",
        answers: ["9", "6"],
        correct: "6",
        success: "Good job, Yunus! 6 is smaller."
      },
      {
        level: "Level 7",
        question: "What number is missing? 10, 9, __, 7",
        answers: ["6", "8", "5"],
        correct: "8",
        success: "Great thinking, Yunus! 8 is missing."
      },
      {
        level: "Level 8",
        question: "8 needs 2 more to make what number?",
        answers: ["9", "10", "11"],
        correct: "10",
        success: "Amazing, Yunus! 8 and 2 make 10."
      },
      {
        level: "Level 9",
        question: "Which one does not belong? 2, 4, 6, 7, 8",
        answers: ["6", "7", "8"],
        correct: "7",
        success: "Smart job, Yunus! 7 does not belong."
      },
      {
        level: "Level 10",
        question: "Which path is in the right order?",
        answers: ["1, 2, 3, 4", "1, 3, 2, 4", "2, 1, 3, 4"],
        correct: "1, 2, 3, 4",
        success: "Wonderful, Yunus! You found the right path."
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function startGame() {
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      document.getElementById("total").textContent = questions.length;
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("levelTitle").textContent = q.level;
      document.getElementById("questionText").textContent = q.question;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextBtn").classList.add("hidden");

      const answersBox = document.getElementById("answersBox");
      answersBox.innerHTML = "";

      q.answers.forEach(answer => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.textContent = answer;
        btn.onclick = () => checkAnswer(answer);
        answersBox.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      const q = questions[currentQuestion];
      const feedback = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const buttons = document.querySelectorAll(".answer-btn");

      buttons.forEach(btn => btn.disabled = true);

      if (selected === q.correct) {
        score++;
        document.getElementById("score").textContent = score;
        feedback.textContent = "✅ " + q.success;
        feedback.style.color = "green";
      } else {
        feedback.textContent = "💛 Nice try, Yunus! The right answer is " + q.correct + ".";
        feedback.style.color = "#cc8800";
      }

      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.remove("hidden");
      document.getElementById("finalScore").textContent = score + " / " + questions.length;
    }

    function restartGame() {
      currentQuestion = 0;
      score = 0;
      document.getElementById("score").textContent = "0";
      document.getElementById("endScreen").classList.add("hidden");
      document.getElementById("startScreen").classList.remove("hidden");
    }
  </script>
</body>
</html>
