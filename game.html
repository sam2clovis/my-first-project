<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yunus' Super Number Treasure Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ff;
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    h1 {
      color: #4a3db8;
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 22px;
      line-height: 1.5;
    }

    .yunus-name {
      color: #ff7a00;
      font-weight: bold;
    }

    .question-box {
      background: #eef3ff;
      border-radius: 18px;
      padding: 25px;
      margin: 25px 0;
      min-height: 140px;
    }

    .question {
      font-size: 32px;
      font-weight: bold;
      color: #253b80;
      margin-bottom: 20px;
    }

    .answers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .answer-btn, .start-btn, .next-btn {
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 24px;
      cursor: pointer;
    }

    .answer-btn {
      background: #ffd76a;
      min-width: 110px;
    }

    .answer-btn:hover {
      transform: scale(1.05);
    }

    .start-btn, .next-btn {
      background: #4a3db8;
      color: white;
      margin-top: 15px;
    }

    .feedback {
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
      min-height: 45px;
    }

    .score {
      font-size: 24px;
      margin-bottom: 15px;
      color: #555;
    }

    .star {
      font-size: 34px;
    }

    .hidden {
      display: none;
    }

    .level-title {
      font-size: 26px;
      color: #7a4fd1;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Yunus' Super Number Treasure Game</h1>
    <p>Let’s play with numbers, <span class="yunus-name">Yunus</span>!</p>

    <div id="startScreen">
      <p>Answer the number questions and find the treasure.</p>
      <button class="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <div id="gameScreen" class="hidden">
      <div class="score">Score: <span id="score">0</span> / <span id="total">0</span></div>
      <div class="level-title" id="levelTitle"></div>

      <div class="question-box">
        <div class="question" id="questionText"></div>
        <div class="answers" id="answersBox"></div>
      </div>

      <div class="feedback" id="feedback"></div>
      <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

    <div id="endScreen" class="hidden">
      <h2>Great job, <span class="yunus-name">Yunus</span>!</h2>
      <p>You finished the game.</p>
      <p class="star">⭐ ⭐ ⭐</p>
      <p>Your score: <span id="finalScore"></span></p>
      <button class="start-btn" onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        level: "Level 1: What Comes Next?",
        question: "What comes next? 1, 2, 3, __",
        answers: ["4", "5", "6"],
        correct: "4",
        success: "Perfect, Yunus! 4 comes next."
      },
      {
        level: "Level 1: What Comes Next?",
        question: "What comes next? 2, 3, 4, __",
        answers: ["5", "6", "7"],
        correct: "5",
        success: "Great job, Yunus! 5 comes next."
      },
      {
        level: "Level 1: What Comes Next?",
        question: "What comes next? 5, 6, 7, __",
        answers: ["8", "9", "10"],
        correct: "8",
        success: "Awesome, Yunus! 8 comes next."
      },

      {
        level: "Level 2: Bigger Number",
        question: "Which number is bigger?",
        answers: ["8", "5"],
        correct: "8",
        success: "Great job, Yunus! 8 is bigger."
      },
      {
        level: "Level 2: Bigger Number",
        question: "Which number is bigger?",
        answers: ["3", "7"],
        correct: "7",
        success: "Perfect, Yunus! 7 is bigger."
      },
      {
        level: "Level 2: Bigger Number",
        question: "Which number is bigger?",
        answers: ["9", "4"],
        correct: "9",
        success: "Nice work, Yunus! 9 is bigger."
      },

      {
        level: "Level 3: Count by 2",
        question: "What comes next? 2, 4, 6, __",
        answers: ["7", "8", "10"],
        correct: "8",
        success: "Awesome, Yunus! 8 comes next."
      },
      {
        level: "Level 3: Count by 2",
        question: "What comes next? 4, 6, 8, __",
        answers: ["9", "10", "12"],
        correct: "10",
        success: "Great job, Yunus! 10 comes next."
      },
      {
        level: "Level 3: Count by 2",
        question: "What comes next? 6, 8, 10, __",
        answers: ["11", "12", "13"],
        correct: "12",
        success: "Wonderful, Yunus! 12 comes next."
      },

      {
        level: "Level 4: Pattern Time",
        question: "Look at the pattern: 1, 3, 1, 3, 1, __",
        answers: ["2", "3", "4"],
        correct: "3",
        success: "Yes, Yunus! 3 comes next."
      },
      {
        level: "Level 4: Pattern Time",
        question: "Look at the pattern: 2, 4, 2, 4, 2, __",
        answers: ["4", "5", "6"],
        correct: "4",
        success: "Perfect, Yunus! 4 comes next."
      },
      {
        level: "Level 4: Pattern Time",
        question: "Look at the pattern: 5, 1, 5, 1, 5, __",
        answers: ["1", "2", "5"],
        correct: "1",
        success: "Great thinking, Yunus! 1 comes next."
      },

      {
        level: "Level 5: Add a Little More",
        question: "You have 4. Add 1 more. What number now?",
        answers: ["5", "6", "7"],
        correct: "5",
        success: "Perfect, Yunus! 4 and 1 make 5."
      },
      {
        level: "Level 5: Add a Little More",
        question: "You have 3. Add 2 more. What number now?",
        answers: ["4", "5", "6"],
        correct: "5",
        success: "Great job, Yunus! 3 and 2 make 5."
      },
      {
        level: "Level 5: Add a Little More",
        question: "You have 6. Add 1 more. What number now?",
        answers: ["7", "8", "9"],
        correct: "7",
        success: "Awesome, Yunus! 6 and 1 make 7."
      },

      {
        level: "Level 6: Smaller Number",
        question: "Which number is smaller?",
        answers: ["9", "6"],
        correct: "6",
        success: "Good job, Yunus! 6 is smaller."
      },
      {
        level: "Level 6: Smaller Number",
        question: "Which number is smaller?",
        answers: ["2", "5"],
        correct: "2",
        success: "Perfect, Yunus! 2 is smaller."
      },
      {
        level: "Level 6: Smaller Number",
        question: "Which number is smaller?",
        answers: ["8", "3"],
        correct: "3",
        success: "Nice work, Yunus! 3 is smaller."
      },

      {
        level: "Level 7: Missing Number",
        question: "What number is missing? 10, 9, __, 7",
        answers: ["6", "8", "5"],
        correct: "8",
        success: "Great thinking, Yunus! 8 is missing."
      },
      {
        level: "Level 7: Missing Number",
        question: "What number is missing? 6, __, 8",
        answers: ["5", "7", "9"],
        correct: "7",
        success: "Perfect, Yunus! 7 is missing."
      },
      {
        level: "Level 7: Missing Number",
        question: "What number is missing? 3, 4, __, 6",
        answers: ["5", "7", "8"],
        correct: "5",
        success: "Wonderful, Yunus! 5 is missing."
      },

      {
        level: "Level 8: Make 10",
        question: "8 needs 2 more to make what number?",
        answers: ["9", "10", "11"],
        correct: "10",
        success: "Amazing, Yunus! 8 and 2 make 10."
      },
      {
        level: "Level 8: Make 10",
        question: "7 needs 3 more to make what number?",
        answers: ["9", "10", "11"],
        correct: "10",
        success: "Great job, Yunus! 7 and 3 make 10."
      },
      {
        level: "Level 8: Make 10",
        question: "9 needs 1 more to make what number?",
        answers: ["10", "11", "12"],
        correct: "10",
        success: "Perfect, Yunus! 9 and 1 make 10."
      },

      {
        level: "Level 9: Odd One Out",
        question: "Which one does not belong with the even numbers? 2, 4, 6, 7, 8",
        answers: ["6", "7", "8"],
        correct: "7",
        success: "Smart job, Yunus! 7 does not belong."
      },
      {
        level: "Level 9: Odd One Out",
        question: "Which one does not belong with the odd numbers? 1, 3, 5, 6, 7",
        answers: ["5", "6", "7"],
        correct: "6",
        success: "Excellent, Yunus! 6 does not belong."
      },
      {
        level: "Level 9: Odd One Out",
        question: "Which one does not belong with the even numbers? 4, 8, 10, 11, 12",
        answers: ["10", "11", "12"],
        correct: "11",
        success: "Wonderful, Yunus! 11 does not belong."
      },

      {
        level: "Level 10: Right Order",
        question: "Which path is in the right order?",
        answers: ["1, 2, 3, 4", "1, 3, 2, 4", "2, 1, 3, 4"],
        correct: "1, 2, 3, 4",
        success: "Wonderful, Yunus! You found the right path."
      },
      {
        level: "Level 10: Right Order",
        question: "Which path is in the right order?",
        answers: ["4, 5, 6", "4, 6, 5", "5, 4, 6"],
        correct: "4, 5, 6",
        success: "Perfect, Yunus! That is the right order."
      },
      {
        level: "Level 10: Right Order",
        question: "Which path is in the right order?",
        answers: ["7, 8, 9", "7, 9, 8", "8, 7, 9"],
        correct: "7, 8, 9",
        success: "Amazing, Yunus! That is the right order."
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function startGame() {
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      document.getElementById("total").textContent = questions.length;
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("levelTitle").textContent = q.level;
      document.getElementById("questionText").textContent = q.question;
      document.getElementById("feedback").textContent = "";
      document.getElementById("nextBtn").classList.add("hidden");

      const answersBox = document.getElementById("answersBox");
      answersBox.innerHTML = "";

      q.answers.forEach(answer => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.textContent = answer;
        btn.onclick = () => checkAnswer(answer);
        answersBox.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      const q = questions[currentQuestion];
      const feedback = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const buttons = document.querySelectorAll(".answer-btn");

      buttons.forEach(btn => btn.disabled = true);

      if (selected === q.correct) {
        score++;
        document.getElementById("score").textContent = score;
        feedback.textContent = "✅ " + q.success;
        feedback.style.color = "green";
      } else {
        feedback.textContent = "💛 Nice try, Yunus! The right answer is " + q.correct + ".";
        feedback.style.color = "#cc8800";
      }

      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      document.getElementById("gameScreen").classList.add("hidden");
      document.getElementById("endScreen").classList.remove("hidden");
      document.getElementById("finalScore").textContent = score + " / " + questions.length;
    }

    function restartGame() {
      currentQuestion = 0;
      score = 0;
      document.getElementById("score").textContent = "0";
      document.getElementById("endScreen").classList.add("hidden");
      document.getElementById("startScreen").classList.remove("hidden");
    }
  </script>
</body>
</html>
